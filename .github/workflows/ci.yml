name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      # Algorithm tests, the sklearn cross-check, regression tests for the
      # fixed bugs, and smoke tests of both dashboard pages
      - run: pytest -q
